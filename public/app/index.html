<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="แจ้งปัญหา">
<title>Tech Dept แจ้งปัญหา</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1c1d24; --muted:#6b6f80; --line:#e3e5ee;
  --brand:#4f46e5; --brand-ink:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1016; --card:#1a1b24; --text:#ecedf3; --muted:#9a9db0; --line:#2b2d3a;
    --brand:#818cf8; --brand-ink:#0f1016; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{padding:0 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:2px solid var(--line);border-radius:14px;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+label{border-color:var(--brand);color:var(--brand)}
.seg input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.seg .ico{font-size:26px}
.field{margin-top:14px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field small{color:var(--muted);font-weight:400}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:17px}
.btn:disabled{opacity:.6}
.note{color:var(--muted);font-size:13px;margin-top:10px}
.msg{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:15px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.msg a{color:inherit;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{background:none;border:0;padding:10px 0 12px;font:inherit;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button[aria-selected=true]{color:var(--brand);font-weight:700}
.report{display:block;color:inherit;text-decoration:none}
.report h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
.track i{height:6px;border-radius:3px;background:var(--line)}
.track i.on{background:var(--brand)}
.track i.done{background:var(--ok)}
.stage{display:inline-block;margin-top:8px;font-size:13px;font-weight:700}
.stage.warn{color:var(--warn)} .stage.ok{color:var(--ok)} .stage.bad{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="title">แจ้งเรื่องใหม่</h1>
  <p id="subtitle">ส่งปัญหาหรือไอเดีย ทีม AI จะวิเคราะห์และลงมือทำให้</p>
</header>

<main>
  <section id="view-new">
    <form id="form" class="card" novalidate>
      <div class="seg" role="radiogroup" aria-label="ประเภท">
        <input type="radio" name="kind" id="k-bug" value="bug" checked><label for="k-bug"><span class="ico">🐞</span>แจ้งปัญหา</label>
        <input type="radio" name="kind" id="k-feature" value="feature"><label for="k-feature"><span class="ico">💡</span>ขอฟีเจอร์</label>
      </div>
      <div class="field">
        <label for="f-title">หัวข้อ</label>
        <input type="text" id="f-title" maxlength="120" required placeholder="เช่น ปุ่มบันทึกงานกดไม่ได้">
      </div>
      <div class="field">
        <label for="f-desc">รายละเอียด</label>
        <textarea id="f-desc" maxlength="4000" required placeholder="เกิดอะไรขึ้น และคุณคาดว่าควรเป็นอย่างไร"></textarea>
      </div>
      <div class="field" id="steps-field">
        <label for="f-steps">ขั้นตอนที่ทำให้เกิดปัญหา <small>(ไม่บังคับ)</small></label>
        <textarea id="f-steps" maxlength="2000" placeholder="1. เปิดหน้า…&#10;2. กด…"></textarea>
      </div>
      <button class="btn" id="submit" type="submit">ส่งเรื่อง</button>
      <p class="note">⚠️ ข้อความจะถูกเผยแพร่เป็น issue บน GitHub สาธารณะ อย่าใส่ข้อมูลส่วนตัวหรือรหัสผ่าน</p>
      <div id="result" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="view-mine" hidden>
    <div id="list"></div>
  </section>
</main>

<nav role="tablist">
  <button role="tab" id="tab-new" aria-selected="true" aria-controls="view-new"><span>✍️</span>แจ้งเรื่อง</button>
  <button role="tab" id="tab-mine" aria-selected="false" aria-controls="view-mine"><span>📋</span>เรื่องของฉัน</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function store(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function keep(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

let device = store('device', null);
if (!device) { device = crypto.randomUUID(); keep('device', device); }

// Pipeline stages, in order, with Thai labels. Index = how far along the progress bar is.
const STAGE = {
  received:           { i: 0, label: 'ได้รับเรื่องแล้ว', cls: '' },
  'needs-info':       { i: 1, label: 'ต้องการข้อมูลเพิ่ม — ดูคำถามใน GitHub', cls: 'warn' },
  triaged:            { i: 1, label: 'คัดแยกแล้ว', cls: '' },
  planned:            { i: 2, label: 'วางแผนแล้ว', cls: '' },
  'waiting-approval': { i: 2, label: 'รอทีมอนุมัติ', cls: 'warn' },
  building:           { i: 3, label: 'AI กำลังพัฒนา', cls: '' },
  review:             { i: 4, label: 'กำลังรีวิว', cls: '' },
  done:               { i: 5, label: 'เสร็จแล้ว', cls: 'ok' },
  released:           { i: 5, label: 'ปล่อยเวอร์ชันแล้ว 🚀', cls: 'ok' },
  closed:             { i: 0, label: 'ปิดโดยไม่ดำเนินการ', cls: 'bad' },
};

function show(view) {
  const mine = view === 'mine';
  $('#view-new').hidden = mine; $('#view-mine').hidden = !mine;
  $('#tab-new').setAttribute('aria-selected', !mine);
  $('#tab-mine').setAttribute('aria-selected', mine);
  $('#title').textContent = mine ? 'เรื่องของฉัน' : 'แจ้งเรื่องใหม่';
  $('#subtitle').textContent = mine ? 'ติดตามสถานะแต่ละเรื่องตั้งแต่รับเรื่องจนปล่อยเวอร์ชัน' : 'ส่งปัญหาหรือไอเดีย ทีม AI จะวิเคราะห์และลงมือทำให้';
  if (mine) loadList();
}
$('#tab-new').onclick = () => show('new');
$('#tab-mine').onclick = () => show('mine');

document.querySelectorAll('input[name=kind]').forEach(r => r.onchange = () => {
  $('#steps-field').hidden = $('input[name=kind]:checked').value !== 'bug';
});

$('#form').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#submit'), out = $('#result');
  const payload = {
    kind: $('input[name=kind]:checked').value,
    title: $('#f-title').value,
    description: $('#f-desc').value,
    steps: $('#steps-field').hidden ? '' : $('#f-steps').value,
    device,
    platform: navigator.userAgent.slice(0, 120),
  };
  btn.disabled = true; btn.textContent = 'กำลังส่ง…'; out.innerHTML = '';
  try {
    const r = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'ส่งไม่สำเร็จ');
    out.innerHTML = `<div class="msg ok">✅ ส่งแล้ว เป็นเรื่อง <a href="${esc(data.issueUrl)}" target="_blank" rel="noopener">#${esc(data.issueNumber)}</a> ติดตามได้ที่แท็บ “เรื่องของฉัน”</div>`;
    $('#form').reset(); $('#steps-field').hidden = false;
  } catch (err) {
    out.innerHTML = `<div class="msg bad">${esc(navigator.onLine ? err.message : 'ไม่มีอินเทอร์เน็ต ลองใหม่เมื่อออนไลน์')}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'ส่งเรื่อง';
  }
};

function card(rep) {
  const s = STAGE[rep.stage] || STAGE.received;
  const bars = [0, 1, 2, 3, 4].map(n => `<i class="${s.i === 5 ? 'done' : n <= s.i ? 'on' : ''}"></i>`).join('');
  const when = new Date(rep.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  return `<a class="card report" href="${esc(rep.issueUrl)}" target="_blank" rel="noopener">
    <h3>${rep.kind === 'bug' ? '🐞' : '💡'} ${esc(rep.title)}</h3>
    <div class="meta">#${esc(rep.issueNumber)} · ${esc(when)}</div>
    <div class="track" aria-hidden="true">${bars}</div>
    <span class="stage ${s.cls}">${esc(s.label)}</span>
  </a>`;
}

async function loadList() {
  const list = $('#list');
  if (!list.children.length) list.innerHTML = '<p class="empty">กำลังโหลด…</p>';
  try {
    const reps = await (await fetch('/api/reports?device=' + encodeURIComponent(device))).json();
    if (!reps.length) { list.innerHTML = '<p class="empty">ยังไม่มีเรื่องที่คุณส่ง</p>'; return; }
    list.innerHTML = reps.map(card).join('');
    // Refresh each one's live stage from GitHub, then re-render.
    const fresh = await Promise.all(reps.map(r => fetch('/api/reports/' + encodeURIComponent(r.id)).then(x => x.ok ? x.json() : r).catch(() => r)));
    list.innerHTML = fresh.map(card).join('');
  } catch {
    list.innerHTML = '<p class="empty">โหลดไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</p>';
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
