name: Claude issue fixer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.label.name == 'claude-fix' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A maintainer added the `claude-fix` label to issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Use the issue-fixer subagent to fix it end to end: branch, failing test, fix, `npm test`, PR with `Closes #${{ github.event.issue.number }}`, and a comment on the issue with the test results.
            You are running in GitHub Actions on Linux; use Bash. `gh` is authenticated through GH_TOKEN.
          claude_args: |
            --max-turns 40
            --allowedTools "Task,Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(node:*),Bash(mktemp:*),Bash(cat:*),Bash(ls:*)"
